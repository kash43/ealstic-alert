# ---------------------------------------------------------------
# Elasticsearch connection
# Values may reference environment variables as ${ENV.NAME}
#
# es.url can be https:// or http://
#   https: TLS is verified with es.ca_cert (or the system CAs)
#   http : es.ca_cert and es.insecure_skip_verify are ignored
#
# Authentication: use ONE of the two options below (or neither,
# for a cluster with security disabled)
# ---------------------------------------------------------------
es.url=http://192.168.33.10:9200

# Option 1: username + password
es.username=elastic
es.password=${ENV.ES_PASSWORD}

# Option 2: API key (the base64 "encoded" value from Elasticsearch)
# es.api_key=${ENV.ES_API_KEY}

# https only: CA certificate (PEM) used to verify the server certificate
es.ca_cert=/etc/es-certs/ca.crt
# https only: for testing, disables certificate verification
es.insecure_skip_verify=false

es.timestamp_field=@timestamp
# Field that holds the log text (Fluent Bit's default key is "log")
es.message_field=json_payload
# Max log lines attached to each alert card
es.max_log_lines=20

# ---------------------------------------------------------------
# Schedule
# check.interval: how often to query Elasticsearch
# check.window:   how far back each query looks (defaults to the interval)
# ---------------------------------------------------------------
check.interval=5m
check.window=5m

# ---------------------------------------------------------------
# Email
# smtp.enabled=false : nothing is sent, each triggered alert group is
#                      only written to the log (the settings below are
#                      then not required)
# smtp.security     : starttls | ssl | none
# ---------------------------------------------------------------
smtp.enabled=true
smtp.host=smtp.gmail.com
smtp.port=465
smtp.security=ssl
smtp.username=ashitha.kandambige@gmail.com
smtp.password=${ENV.SMTP_PASSWORD}
smtp.from=Log Alerts <alerts@gmail.com>
smtp.subject_prefix=[Log Alerts]

# ---------------------------------------------------------------
# Alerts
# alerts.<name>.index       index, alias, data stream or pattern to search
#                           (comma-separated for several, wildcards allowed)
# alerts.<name>.log         log line (phrase) to search for
# alerts.<name>.count.type  higher -> fires when matches  > count
#                           below  -> fires when matches  < count
#                           (0 matches is never reported)
# alerts.<name>.count.count trigger point
# alerts.<name>.email       comma-separated recipient list
# ---------------------------------------------------------------
alerts.payment-errors.index=api-*
alerts.payment-errors.log=payment gateway timeout
alerts.payment-errors.subject=Payment gateway timeouts
alerts.payment-errors.count.type=higher
alerts.payment-errors.count.count=5
alerts.payment-errors.email=kash.ashitha@gmail.com

alerts.heartbeat-low.index=fluent-bit-*
alerts.heartbeat-low.log=scheduler heartbeat ok
alerts.heartbeat-low.subject=Scheduler heartbeat is low
alerts.heartbeat-low.count.type=below
alerts.heartbeat-low.count.count=5
alerts.heartbeat-low.email=kash.ashitha@gmail.com

alerts.db-connection-lost.index=db-logs-*
alerts.db-connection-lost.log=connection refused
alerts.db-connection-lost.subject=Database connection refused
alerts.db-connection-lost.count.type=higher
alerts.db-connection-lost.count.count=0
alerts.db-connection-lost.email=kash.ashitha@gmail.com